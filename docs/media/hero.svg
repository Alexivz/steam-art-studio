  <text x="60" y="153" fill="#f1f6fa" font-family="DejaVu Sans,Arial,sans-serif" font-size="58" font-weight="700">Tu biblioteca.</text>
  <text x="60" y="224" fill="#70e2cb" font-family="DejaVu Sans,Arial,sans-serif" font-size="58" font-weight="700">Tu estilo.</text>
  <text x="63" y="272" fill="#afc3cc" font-family="DejaVu Sans,Arial,sans-serif" font-size="18">Arte, animaciones y copias en un solo espacio.</text>
  <rect x="62" y="310" width="157" height="33" rx="16" fill="#70e2cb" fill-opacity=".10" stroke="#70e2cb" stroke-opacity=".25"/>
  <text x="82" y="332" fill="#c4f4e9" font-family="DejaVu Sans,Arial,sans-serif" font-size="13">LINUX + WINDOWS</text>
  <text x="241" y="332" fill="#94acb9" font-family="DejaVu Sans,Arial,sans-serif" font-size="13">INDEPENDIENTE · CÓDIGO ABIERTO</text>
