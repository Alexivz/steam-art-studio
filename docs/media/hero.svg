<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Steam Art Studio — Tu biblioteca. Tu estilo.</title>
  <desc id="desc">Cabecera oscura y turquesa con tres tarjetas de arte abstracto. Aplicación independiente para Linux y Windows.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b111a"/><stop offset="1" stop-color="#122d32"/></linearGradient>
    <linearGradient id="mint" x2="1" y2="1"><stop stop-color="#88f5d9"/><stop offset="1" stop-color="#279c96"/></linearGradient>
    <linearGradient id="purple" x2="1" y2="1"><stop stop-color="#8864cc"/><stop offset="1" stop-color="#242040"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#386a98"/><stop offset="1" stop-color="#162a41"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a7f3df" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <circle cx="1130" cy="80" r="230" fill="none" stroke="#70e2cb" stroke-opacity=".10"/>
  <circle cx="1130" cy="80" r="190" fill="none" stroke="#70e2cb" stroke-opacity=".07"/>
  <rect x="60" y="52" width="34" height="4" rx="2" fill="#70e2cb"/>
